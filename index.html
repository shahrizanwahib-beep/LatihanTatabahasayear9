<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 9 · Ulang Kaji Unit 1–5</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ea;color:#16362d;font:17px/1.5 system-ui}header,main{max-width:850px;margin:auto;padding:20px}h1{font-size:clamp(32px,6vw,65px);line-height:1;margin:.3em 0}nav{position:sticky;top:0;background:#153d31;color:white;padding:12px;z-index:2;text-align:center}nav a{color:white;margin:0 .35em;display:inline-block}section{scroll-margin-top:115px}fieldset,article{background:white;border:1px solid #ccd6cd;border-radius:12px;padding:16px;margin:12px 0;min-width:0}legend{font-weight:bold;background:white;padding:0 6px}label.option{display:block;padding:6px;cursor:pointer}textarea,input[type=text]{font:inherit;width:100%;padding:10px;border:1px solid #799084;border-radius:6px}button{background:#164737;color:white;padding:10px 16px;border:0;border-radius:6px;font:inherit;cursor:pointer}#result{scroll-margin-top:110px}.feedback{color:#16593c;font-weight:bold}
fieldset{width:100%;min-inline-size:0}fieldset legend{display:table;float:left;width:100%;max-inline-size:100%;padding:0 0 8px;white-space:normal;overflow-wrap:anywhere}fieldset legend+label{clear:both}label.option,article label{overflow-wrap:anywhere}article label{display:block}textarea{max-width:100%;resize:vertical}</style><header><strong>YEAR 9 · BAHASA MELAYU</strong><h1>Ulang Kaji Unit 1–5</h1><p>Jawab 40 soalan objektif dan taip jawapan bagi 10 soalan subjektif. Draf disimpan dalam pelayar ini.</p></header>
<nav id="nav"></nav><main><form id="quiz"><article><label>Nama murid <input type="text" name="nama" required></label><label>Kelas <input type="text" name="kelas" required></label></article><div id="questions"></div><button type="submit">Semak dan lengkapkan latihan</button></form><article id="result" hidden tabindex="-1"></article></main>
<script>
const groups=[["Kesihatan dan Kecergasan", [["Apakah yang boleh kamu minum apabila dahaga?", "Air kosong", "Sos cili", "Minyak masak", "Kicap"], ["Apakah aktiviti yang melibatkan pergerakan badan?", "Berjoging", "Menonton televisyen", "Membaca buku", "Mendengar radio"], ["Apakah yang patut dilakukan sebelum memulakan latihan sukan?", "Memanaskan badan", "Menyimpan kasut", "Menutup gelanggang", "Menamatkan latihan"], ["Apakah contoh hidangan yang mengandungi sayur dan protein?", "Nasi, ikan dan bayam", "Nasi dan mi", "Roti dan jem", "Biskut dan kek"], ["Nina bersenam pada hari Isnin dan Khamis. Berapa kali seminggu dia bersenam?", "Dua kali", "Sekali", "Tiga kali", "Empat kali"], ["Hakim letih kerana tidur lewat. Apakah sebab dia letih?", "Dia tidur lewat.", "Dia bersarapan.", "Dia berjalan kaki.", "Dia minum air."]]], ["Bertemu Orang, Adat dan Kebudayaan di Luar Negara", [["Kamu bertemu pelajar baharu. Apakah ayat untuk memperkenalkan diri?", "Nama saya Rina.", "Tiket ini milik saya.", "Bas itu sudah tiba.", "Saya hendak membeli buku."], ["Apakah yang kamu ucapkan selepas tuan rumah membantu kamu?", "Terima kasih.", "Selamat datang.", "Selamat jalan.", "Selamat pagi."], ["“Di rumah ini, tetamu menanggalkan kasut sebelum masuk.” Apakah yang dilakukan dahulu?", "Menanggalkan kasut", "Masuk ke rumah", "Duduk di ruang tamu", "Mengambil makanan"], ["Apakah maksud “pakaian tradisional”?", "Traditional clothing", "School timetable", "Public transport", "Sports equipment"], ["Semasa lawatan, Lina mencuba hidangan tempatan. Apakah maksud “tempatan”?", "Berasal dari tempat itu", "Dibawa dari rumah Lina", "Dihidangkan pada waktu pagi", "Dibeli sebelum perjalanan"], ["Kamu kurang pasti tentang adat di rumah yang dikunjungi. Apakah yang boleh kamu tanya?", "“Adakah saya perlu menanggalkan kasut?”", "“Berapakah harga tiket bas?”", "“Di manakah kedai buku?”", "“Apakah waktu penerbangan kita?”"]]], ["Aktiviti Masa Lapang dan Membeli-belah", [["Apakah aktiviti yang memerlukan raket dan bulu tangkis?", "Bermain badminton", "Bermain bola sepak", "Berenang", "Berbasikal"], ["Apakah soalan yang sesuai untuk mengetahui harga baju?", "Berapakah harga baju ini?", "Apakah warna baju ini?", "Di manakah bilik persalinan?", "Bolehkah saya mencuba baju ini?"], ["Baju berharga RM35. Ali membayar RM50. Berapakah baki wangnya?", "RM15", "RM10", "RM20", "RM25"], ["Di manakah pelanggan boleh mencuba pakaian dengan privasi?", "Bilik persalinan", "Kaunter bayaran", "Pintu masuk", "Tempat letak kereta"], ["Apakah yang biasanya diberikan selepas pelanggan membayar?", "Resit", "Jadual waktu", "Kad jemputan", "Peta bandar"], ["“Pada waktu lapang, Mei gemar melukis.” Apakah kegemaran Mei?", "Melukis", "Memasak", "Membaca", "Membeli-belah"]]], ["Komunikasi dan Bahasa di Tempat Kerja", [["Di manakah pekerja pejabat biasanya berbincang dalam kumpulan?", "Bilik mesyuarat", "Bilik persalinan", "Pawagam", "Perhentian bas"], ["Apakah ayat permintaan yang sopan untuk mendapatkan fail?", "Bolehkah anda hantarkan fail itu kepada saya?", "Fail itu berwarna biru.", "Saya sudah membaca fail itu.", "Fail itu ada di atas meja."], ["“Mesyuarat esok dipindahkan ke pukul 10 pagi.” Apakah perubahan yang dinyatakan?", "Waktu mesyuarat", "Tempat mesyuarat", "Nama pengerusi", "Tujuan mesyuarat"], ["Apakah yang patut kamu catat apabila seseorang mahu rakan sekerja menghubunginya semula?", "Nama dan nombor telefon", "Warna dan harga fail", "Lokasi dan saiz meja", "Tarikh cuti umum"], ["Apakah cara yang sesuai untuk menghantar dokumen digital kepada rakan sekerja?", "Melampirkannya pada e-mel", "Melekatkannya pada papan kenyataan", "Menyimpannya dalam laci", "Mencetaknya untuk kegunaan sendiri"], ["“Selepas menyemak senarai, serahkan borang kepada penyelia.” Apakah tindakan pertama?", "Menyemak senarai", "Menyerahkan borang", "Menghubungi pelanggan", "Menempah bilik mesyuarat"]]], ["Cuaca dan Cuaca Dunia", [["Daun dan bendera bergerak ditiup angin. Bagaimanakah cuaca?", "Berangin", "Bersalji", "Cerah", "Hujan"], ["Apakah yang sesuai digunakan apabila hujan turun?", "Payung", "Raket", "Buku nota", "Beg kertas"], ["Apakah maksud “bersalji”?", "Snowy", "Sunny", "Windy", "Cloudy"], ["“Pada pagi Sabtu, salji turun di Sapporo.” Bilakah salji turun?", "Pada pagi Sabtu", "Pada petang Sabtu", "Pada pagi Ahad", "Pada petang Ahad"], ["Dalam laporan Mika, Sydney cerah dan panas. Bagaimanakah keadaan di Sydney?", "Cerah dan panas", "Sejuk dan bersalji", "Berawan dan sejuk", "Hujan lebat"], ["Hujan turun di Kuala Lumpur, manakala Sydney cerah. Di bandar manakah hujan turun?", "Kuala Lumpur", "Sydney", "Sapporo", "Kedua-dua bandar"]]], ["Tatabahasa", [["Yang manakah kata nama khas?", "Kuala Lumpur", "bandar", "pejabat", "restoran"], ["Yang manakah kata nama am?", "pelanggan", "Mika", "Sydney", "Melaka"], ["Dalam ayat “Pekerja menyemak borang”, apakah kata kerjanya?", "menyemak", "pekerja", "borang", "pekerja menyemak"], ["Saya datang ___ Johor sebelum pergi ke Melaka.", "dari", "daripada", "kepada", "pada"], ["Pesanan itu ___ penyelia pejabat.", "daripada", "dari", "di", "ke"], ["Kami pergi ___ kedai selepas kelas.", "ke", "di", "pada", "kepada"], ["Pilih ejaan kata sendi yang betul.", "di pejabat", "dipejabat", "di-pejabat", "diPejabat"], ["Saya membawa payung ___ hujan turun.", "kerana", "tetapi", "atau", "sambil"], ["Cuaca sejuk, ___ kami masih berjalan ke kedai.", "tetapi", "supaya", "kerana", "atau"], ["Pilih penjodoh bilangan untuk “dua ___ baju”.", "helai", "ekor", "orang", "batang"]]]];
const writing=[["Tulis satu cadangan untuk kekal cergas dan beri sebab."], ["Rakan kamu berasa dahaga selepas bersukan. Tulis satu nasihat kepadanya."], ["Perkenalkan diri kepada pelajar dari luar negara. Tulis dua ayat yang menyatakan nama dan tempat asal kamu."], ["Tulis satu soalan sopan kepada tuan rumah untuk bertanya sama ada kamu perlu menanggalkan kasut."], ["Tulis satu ayat tentang aktiviti masa lapang yang kamu suka dan waktu kamu melakukannya."], ["Kamu mahu tahu harga sehelai baju. Tulis satu soalan yang sesuai kepada jurujual."], ["Tulis pesanan kepada rakan sekerja. Nyatakan bahawa mesyuarat bermula pada pukul 10 pagi di bilik mesyuarat."], ["Betulkan dua kesalahan ejaan kata sendi. “Saya berada dipejabat sebelum pergi kebilik mesyuarat.”"], ["Tulis satu ayat laporan. Salji turun di Sapporo pada waktu pagi. Nyatakan waktu, bandar dan cuaca."], ["Bandingkan cuaca di Sapporo dan Sydney dalam satu ayat menggunakan “tetapi”. Sapporo sejuk dan Sydney panas."]];
const form=document.querySelector('#quiz'), questions=document.querySelector('#questions'), result=document.querySelector('#result');
const objective=groups.flatMap(([,items])=>items);
let number=0;
function choices(item,index){
 const [question,...answers]=item;
 const turn=(index*7+Math.floor(index/4))%4;
 const rotated=answers.slice(turn).concat(answers.slice(0,turn));
 return '<fieldset><legend>'+(index+1)+'. '+question+'</legend>'+rotated.map(answer=>'<label class="option"><input required type="radio" name="q'+index+'" value="'+answers.indexOf(answer)+'"> '+answer+'</label>').join('')+'</fieldset>';
}
questions.innerHTML=groups.map(([name,items],index)=>'<section id="g'+index+'"><h2>'+name+'</h2>'+items.map(item=>choices(item,number++)).join('')+'</section>').join('')+'<section id="subjective"><h2>Subjektif</h2>'+writing.map(([question],index)=>'<article><label for="s'+index+'">'+(41+index)+'. '+question+'</label><textarea required rows="3" id="s'+index+'" name="s'+index+'"></textarea></article>').join('')+'</section>';
document.querySelector('#nav').innerHTML=groups.map((_,i)=>'<a href="#g'+i+'">'+(i===5?'Tatabahasa':'Unit '+(i+1))+'</a>').join('')+' <a href="#subjective">Subjektif</a> <span id="progress"></span>';
const storageKey='year9-units1to5-v1';
try{
 const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');
 for(const [name,value] of Object.entries(saved)){
  const field=form.elements.namedItem(name);
  if(field)field.value=value;
 }
}catch{}
function update(){
 const values=Object.fromEntries(new FormData(form));
 const answered=Object.entries(values).filter(([name,value])=>/^[qs]\d+$/.test(name)&&value.trim()).length;
 document.querySelector('#progress').textContent=answered+' / 50';
 try{localStorage.setItem(storageKey,JSON.stringify(values))}catch{}
}
form.addEventListener('input',()=>{result.hidden=true;update()});
form.addEventListener('submit',async event=>{
 event.preventDefault();
 for(const field of form.querySelectorAll('textarea,input[type=text]')){
  if(!field.value.trim()){field.focus();return}
 }
 const values=new FormData(form);
 const score=objective.reduce((sum,_,i)=>sum+Number(values.get('q'+i)==='0'),0);
 result.innerHTML='<p class="feedback">50 daripada 50 soalan dijawab</p><p id="identity"></p>'+'<h2>Objektif '+score+' / 40</h2><p>Jawapan subjektif tersedia untuk semakan guru. Ambil tangkapan skrin keputusan ini.</p><button id="download">Muat turun jawapan</button><details><summary>Semak jawapan objektif</summary><ol>'+objective.map((item,i)=>'<li>'+item[1]+(values.get('q'+i)==='0'?' ✓':'')+'</li>').join('')+'</ol></details>';
 document.querySelector('#identity').textContent=values.get('nama')+' · '+values.get('kelas');
 document.querySelector('#download').onclick=()=>{
  const report=['Nama: '+values.get('nama'),'Kelas: '+values.get('kelas'),'Objektif: '+score+'/40','',...objective.map((item,i)=>(i+1)+'. '+item[1+Number(values.get('q'+i))]),'',...writing.map(([q],i)=>(41+i)+'. '+q+'\n'+values.get('s'+i))].join('\n');
  const url=URL.createObjectURL(new Blob([report],{type:'text/plain;charset=utf-8'}));
  const link=document.createElement('a');link.href=url;link.download='jawapan-year9.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 };
 result.hidden=false;result.focus();result.scrollIntoView();
});
update();
</script></html>
